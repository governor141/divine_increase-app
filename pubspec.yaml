name: divine_increase
description: Divine Increase Business Network — native app for Spiritus Sanctus Ignis Ministry.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  record: ^5.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  photo_view: ^0.14.0
  image_picker: ^1.1.2
  firebase_storage: ^12.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  # The logo already has its own rounded-square navy background, so we
  # don't add another background color behind it here.
