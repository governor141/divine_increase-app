name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install fixed debug keystore
        # Using a fixed keystore (instead of a fresh random one each run)
        # keeps the app's signing fingerprint stable across builds, which
        # Google Sign-In depends on.
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Print debug keystore SHA-1 fingerprint (diagnostic)
        # TEMPORARY: prints the actual SHA-1 of the keystore this build is
        # using, so it can be compared character-for-character against the
        # fingerprint registered in Firebase Console. Remove once Google
        # Sign-In is confirmed working again.
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Inject Firebase config from secrets
        run: |
          sed -i "s/FIREBASE_API_KEY_PLACEHOLDER/${{ secrets.FIREBASE_API_KEY }}/" lib/firebase_options.dart
          sed -i "s/FIREBASE_APP_ID_PLACEHOLDER/${{ secrets.FIREBASE_APP_ID }}/" lib/firebase_options.dart
          sed -i "s/FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/" lib/firebase_options.dart
          sed -i "s/FIREBASE_PROJECT_ID_PLACEHOLDER/${{ secrets.FIREBASE_PROJECT_ID }}/" lib/firebase_options.dart
          sed -i "s/FIREBASE_STORAGE_BUCKET_PLACEHOLDER/${{ secrets.FIREBASE_STORAGE_BUCKET }}/" lib/firebase_options.dart

      - name: Generate Android platform files
        # This project intentionally does not commit an /android folder —
        # it's generated fresh here every time, so it always matches
        # whatever the current Flutter/Gradle template is. This line will
        # NOT touch lib/ or pubspec.yaml, which already exist.
        run: flutter create --platforms=android --org com.spritussanctusignis .

      - name: Set app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Divine Increase"/' android/app/src/main/AndroidManifest.xml

      - name: Disable Firebase auto-init (we use manual FirebaseOptions instead)
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if 'xmlns:tools=' not in content:
              content = content.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          provider_block = '''
              <provider
                  android:name="com.google.firebase.provider.FirebaseInitProvider"
                  android:authorities="${applicationId}.firebaseinitprovider"
                  tools:node="remove" />
          '''
          if 'FirebaseInitProvider' not in content:
              content = re.sub(r'(<application[^>]*>)', r'\1' + provider_block, content, count=1)
          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon from logo
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: divine-increase-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
